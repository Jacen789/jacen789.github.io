<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA应用集合</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;color:#333}
        .container{max-width:1200px;margin:0 auto;padding:40px 20px}
        header{text-align:center;margin-bottom:50px;color:white}
        h1{font-size:3rem;margin-bottom:20px;text-shadow:2px 2px 4px rgba(0,0,0,0.3)}
        p{font-size:1.3rem;opacity:0.9;max-width:600px;margin:0 auto}
        .apps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;margin-bottom:50px}
        .app-card{background:white;border-radius:20px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,0.2);transition:transform 0.3s ease;text-decoration:none;color:inherit;display:block}
        .app-card:hover{transform:translateY(-5px);box-shadow:0 20px 40px rgba(0,0,0,0.3)}
        .app-icon{width:80px;height:80px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;font-size:2rem}
        .app-title{font-size:1.5rem;font-weight:600;margin-bottom:10px;color:#333}
        .app-description{color:#666;line-height:1.6;margin-bottom:20px}
        .app-features{list-style:none;margin-bottom:20px}
        .app-features li{color:#555;margin-bottom:5px;padding-left:20px;position:relative}
        .app-features li:before{content:"✓";position:absolute;left:0;color:#4CAF50;font-weight:bold}
        .app-link{display:inline-block;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:12px 24px;border-radius:25px;text-decoration:none;font-weight:600;transition:transform 0.2s ease}
        .app-link:hover{transform:scale(1.05)}
        .disabled{opacity:0.6;cursor:default;pointer-events:none}
        footer{text-align:center;color:white;opacity:0.8;margin-top:50px}
        @media (max-width:768px){.container{padding:20px 15px}h1{font-size:2.5rem}.apps-grid{grid-template-columns:1fr;gap:20px}}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 PWA应用集合</h1>
            <p>精选的渐进式Web应用，提供原生应用般的体验</p>
        </header>
        
        <div class="apps-grid">
            <a href="camera-pwa/" class="app-card">
                <div class="app-icon">📷</div>
                <h2 class="app-title">摄像头PWA</h2>
                <p class="app-description">调用设备摄像头并显示非镜像视角</p>
                <ul class="app-features">
                    <li>非镜像视角显示</li>
                    <li>响应式设计</li>
                    <li>权限管理</li>
                    <li>离线缓存</li>
                </ul>
                <span class="app-link">立即体验 →</span>
            </a>
            
            <div class="app-card disabled">
                <div class="app-icon">🔮</div>
                <h2 class="app-title">更多应用</h2>
                <p class="app-description">更多精彩的PWA应用正在开发中...</p>
                <ul class="app-features">
                    <li>敬请期待</li>
                </ul>
                <span class="app-link">即将推出</span>
            </div>
        </div>
        
        <footer>
            <p>© 2024 PWA应用集合</p>
        </footer>
    </div>
</body>
</html>
